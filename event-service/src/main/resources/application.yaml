spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusconnect}
    username: ${DB_USER:campusconnect}
    password: ${DB_PASSWORD:campusconnect}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  grpc:
    client:
      channel:
        statistics:
          target: static://${STATISTICS_SERVICE_HOST:localhost}:${STATISTICS_SERVICE_PORT:9090}

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    com.campusconnect.event: INFO
