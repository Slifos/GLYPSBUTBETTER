spring:
  application:
    name: event-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusconnect}
    username: ${DB_USER:campusconnect}
    password: ${DB_PASSWORD:campusconnect}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  grpc:
    client:
      channel:
        statistics:
          target: static://${STATISTICS_SERVICE_HOST:localhost}:${STATISTICS_SERVICE_PORT:9090}
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s # matches the gRPC deadline to statistics-service

user-service:
  base-url: http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8000}

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    com.campusconnect.event: INFO
